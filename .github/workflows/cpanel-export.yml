name: Production cPanel ZIP (transportplockhds.pl)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'scripts/prepare-cpanel.py'
      - '.github/workflows/cpanel-export.yml'

jobs:
  publish-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Test source
        run: npm test
      - name: Build for transportplockhds.pl
        env:
          PUBLIC_SITE_URL: https://transportplockhds.pl
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}
          PUBLIC_GOOGLE_PLACE_ID: ${{ vars.PUBLIC_GOOGLE_PLACE_ID }}
        run: |
          if [ -z "$PUBLIC_GOOGLE_MAPS_API_KEY" ]; then
            echo "::error title=Missing Google API key::Add PUBLIC_GOOGLE_MAPS_API_KEY in repository Settings > Secrets and variables > Actions before exporting the cPanel ZIP."
            exit 1
          fi
          npm run build
      - name: Verify reviews configuration embedded in production HTML
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ReviewsParser(HTMLParser):
              entries = []
              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if 'data-google-reviews' in attributes:
                      self.entries.append(attributes)

          parser = ReviewsParser()
          parser.feed(Path('dist/index.html').read_text(encoding='utf-8'))
          if not parser.entries:
              raise SystemExit('ERROR: Google reviews component missing from built HTML')
          for entry in parser.entries:
              if not entry.get('data-api-key') or not entry.get('data-place-id'):
                  raise SystemExit('ERROR: Google reviews API key or Place ID missing from built HTML')
          print('OK: Google reviews configuration exists in production HTML (values hidden)')
          PY
      - name: Check production SEO
        env:
          PUBLIC_SITE_URL: https://transportplockhds.pl
        run: npm run test:seo:build
      - name: Bundle accessible original HDS images and cPanel settings
        run: python3 scripts/prepare-cpanel.py dist
      - name: Verify no test origin and correct real domain
        run: |
          grep -q 'https://transportplockhds.pl/' dist/sitemap.xml
          grep -q 'https://transportplockhds.pl/' dist/index.html
          ! grep -r -q 'studio-seo-ci.example.invalid' dist/
          ! grep -q 'Disallow: /' dist/robots.txt
          test -f dist/.htaccess
      - name: Package files for direct public_html extraction
        run: |
          cd dist
          zip -q -r ../KALTRUCK_STUDIO_transportplockhds.pl_CPANEL.zip .
          cd ..
          unzip -t KALTRUCK_STUDIO_transportplockhds.pl_CPANEL.zip | tail -2
          ls -lh KALTRUCK_STUDIO_transportplockhds.pl_CPANEL.zip
      - name: Upload cPanel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KALTRUCK_STUDIO_transportplockhds.pl_CPANEL
          path: KALTRUCK_STUDIO_transportplockhds.pl_CPANEL.zip
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
