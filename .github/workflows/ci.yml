name: Website checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run structural tests
        run: npm test
      - name: Build Astro website with test-only HTTPS origin
        env:
          PUBLIC_SITE_URL: https://studio-seo-ci.example.invalid
        run: npm run build
      - name: Verify generated SEO pages and JSON-LD
        env:
          PUBLIC_SITE_URL: https://studio-seo-ci.example.invalid
        run: npm run test:seo:build
